name: recode

services:
  redis:
    image: redis:8.8-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${RECODE_COMPOSE_DATABASE_URL:?set RECODE_COMPOSE_DATABASE_URL in .env}
      - up

  api:
    build:
      context: ./backend
      target: api
    environment: &backend-environment
      RECODE_HTTP_ADDRESS: :8080
      RECODE_DATABASE_URL: ${RECODE_COMPOSE_DATABASE_URL:?set RECODE_COMPOSE_DATABASE_URL in .env}
      RECODE_REDIS_ADDRESS: redis:6379
      RECODE_STORAGE_ROOT: /data
      RECODE_UPLOAD_MAX_BYTES: "1073741824"
      RECODE_RESULT_RETENTION: 2h
    ports:
      - "8080:8080"
    volumes:
      - media_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: worker
    environment: *backend-environment
    volumes:
      - media_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        RECODE_API_ORIGIN: http://api:8080
        RECODE_SITE_URL: ${RECODE_SITE_URL:?set RECODE_SITE_URL in .env}
    environment:
      RECODE_API_ORIGIN: http://api:8080
      RECODE_SITE_URL: ${RECODE_SITE_URL:?set RECODE_SITE_URL in .env}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  media_data:
